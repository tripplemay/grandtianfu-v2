[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grandtianfu-spatial-core"
version = "0.1.0"
description = "Canonical spatial model for a production-grade interior design system"
requires-python = ">=3.12"
dependencies = ["Pillow>=12.3,<13", "opencv-python-headless>=4.13,<5", "numpy>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.15,<1", "playwright>=1.55,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.pytest.ini_options]
testpaths = ["packages/spatial_core/tests", "packages/scene3d/tests", "packages/ingest/tests", "apps/api/tests"]
pythonpath = [".", "packages/spatial_core", "packages/scene3d", "packages/ingest"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
where = ["packages/spatial_core", "packages/scene3d", "packages/ingest"]
include = ["spatial_core*", "scene3d*", "ingest*"]
exclude = ["tests*", "*.tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grandtianfu-spatial-core"
version = "0.1.0"
description = "Canonical spatial model for a production-grade interior design system"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["packages/spatial_core/tests"]
pythonpath = ["packages/spatial_core"]

[tool.setuptools.packages.find]
where = ["packages/spatial_core"]
